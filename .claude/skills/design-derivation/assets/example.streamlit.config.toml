[theme]
# generated by design_tokens.py from design.tokens.json — edit the JSON, not this
# `muted` has no Streamlit option; [[theme.fontFaces]] changes need a server restart
base = "light"
font = "IBM Plex Sans, system-ui, sans-serif"
headingFont = "IBM Plex Mono, ui-monospace, monospace"
codeFont = "IBM Plex Mono, ui-monospace, monospace"
baseRadius = "4px"
buttonRadius = "4px"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "https://fonts.gstatic.com/s/ibmplexmono/v20/-F63fjptAgt5VM-kVkqdyU8n1i8q131nj-o.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "https://fonts.gstatic.com/s/ibmplexsans/v23/zYXGKVElMYYaJe8bpLHnCwDKr932-G7dytD-Dmu1swZSAXcomDVmadSD6llDB6g4tIOm6_De.woff2"
weight = 400
style = "normal"

[theme.light]
primaryColor = "#B0480B"
backgroundColor = "#F3F5F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17232B"
linkColor = "#B0480B"
borderColor = "#D8DFE2"
dataframeBorderColor = "#D8DFE2"
codeBackgroundColor = "#FFFFFF"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F4"

[theme.dark]
primaryColor = "#F2A13B"
backgroundColor = "#0E1A1D"
secondaryBackgroundColor = "#152428"
textColor = "#E6EDEF"
linkColor = "#F2A13B"
borderColor = "#27383D"
dataframeBorderColor = "#27383D"
codeBackgroundColor = "#152428"

[theme.dark.sidebar]
backgroundColor = "#152428"
secondaryBackgroundColor = "#0E1A1D"
